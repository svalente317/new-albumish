<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Dependent Lists</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 40px; padding: 20px; }
        .list-container { flex: 1; }
        select { width: 100%; height: 300px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        h3 { color: #333; }
        .loading { font-style: italic; color: #666; }
    </style>
</head>
<body>

    <div class="list-container">
        <h3>Step 1: Select a User</h3>
        <select id="primaryList" size="10">
            </select>
    </div>

    <div class="list-container">
        <h3>Step 2: User's Posts</h3>
        <ul id="secondaryList">
            <li>Select a user to see their posts...</li>
        </ul>
    </div>

    <script>
        const primaryList = document.getElementById('primaryList');
        const secondaryList = document.getElementById('secondaryList');

        // 1. Fetch initial data on page load
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch('https://jsonplaceholder.typicode.com/users');
                const users = await response.json();
                
                primaryList.innerHTML = users.map(user => 
                    `<option value="${user.id}">${user.name}</option>`
                ).join('');
            } catch (error) {
                console.error('Error fetching users:', error);
            }
        });

        // 2. Fetch dependent data when an item is selected
        primaryList.addEventListener('change', async (event) => {
            const userId = event.target.value;
            secondaryList.innerHTML = '<li class="loading">Loading posts...</li>';

            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts?userId=${userId}`);
                const posts = await response.json();

                // Clear and update the second list
                secondaryList.innerHTML = posts.map(post => 
                    `<li><strong>${post.title}</strong></li>`
                ).join('');
            } catch (error) {
                secondaryList.innerHTML = '<li>Error loading posts.</li>';
                console.error('Error fetching posts:', error);
            }
        });
    </script>

</body>
</html>
